# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in skills, commands, templates and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.
# Edit values manually, or run `bun run agents:setup` for an interactive walkthrough.
# Every unfilled field is `null` plus a TODO comment with a concrete example.

project:
  project_name: qa-novamarket
  project_key: NV # Project key in issue tracker (e.g. PROJ, ACME, UPEX). The boilerplate ships this `null` on purpose — the consumer project fills it; never hardcode a real key here.
  webapp_domain: myproject.com # Domain of the web application under test (e.g. myproject.com)

backend:
  backend_repo: /backend # Relative path to backend repository (e.g. ../my-backend)
  backend_stack: Node.JS, Express.JS, Postgre SQL, JWT, Postman, github, Railway # Backend technology stack (e.g. Node.js + Express)
  backend_entry: src/ # Backend source entry point (e.g. src/)

frontend:
  frontend_repo: /frontend # Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: React, Vite, Tailwind, React Router DOM, Axios, Context API # Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: src/ # Frontend source entry point (e.g. src/)

database:
  db_type: Postgre SQL # Database engine (e.g. PostgreSQL)

issue_tracker:
  issue_tracker: Trello # Issue tracking tool (e.g. Jira)
  issue_tracker_cli: trello # Scale-Flow/trello-cli — JSON-first Trello CLI. Auth via TRELLO_API_KEY + TRELLO_TOKEN in .env (`trello auth set`).
  trello_board: Novamarket # canonical Trello board name (read directly, not a {{VAR}} template)
  trello_board_id: 6aa491a7e9a666fe9d9c648c # canonical Trello board id
  trello_board_url: https://trello.com/b/aRb2rJ1p/novamarket # canonical board URL

testing:
  default_env: development # Default testing environment — must match a key under `environments:` (e.g. staging)
  # TMS (test management system) is not wired in this project: QA tracks tests in
  # Trello cards/checklists + a Google Drive matrix (see docs/qa-standard/traceability-trello-drive.md).
  tms_cli: none # Test management CLI command (e.g. bun xray). `none` = no TMS integration.
  tc_creation_stage: auto

qa:
  formal_blocked_gate: true # When true and the substrate exposes a `blocked` status, FAILED stories stay blocked on the linked bug. Trello has no native `blocked` status; the flag is inert here unless a board list is named `blocked`.

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `strategy: solo-main` as an inherited DEFAULT, not a
# decision — `meta.strategy_source` records the difference (`inherited` until the Strategy
# Setup questionnaire actually runs and stamps `chosen`). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: solo-main # DEFAULT, not a decision — see meta.strategy_source. One of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow | sdet
  description: >
    Single long-lived branch (main); single maintainer (this repo is the boilerplate
    template itself). Work is committed and pushed DIRECTLY to main — never via a PR, and
    without asking the user to confirm each push (standing authorization). Every push to
    main is effectively a release of the template. No integration branch, no promotion
    path, no hotfix ceremony.
    Operational note for the AI: the GitHub ruleset "ProtectPublic" (require-PR +
    required-signatures on main/staging/dev) is bypassed AUTOMATICALLY on `git push`
    because the push credential is a repo/org admin — there is NO explicit bypass flag to
    add; a plain `git push origin main` already applies it. The remote line
    "Bypassed rule violations ... Changes must be made through a pull request" is EXPECTED
    and harmless. Do NOT open a PR, do NOT try to satisfy the rule, do NOT ask to confirm —
    just commit and push.
  branches:
    production: main # release / default branch
    integration: null # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: null # on-demand trunk pattern (e.g. "test/<module>-suite" for sdet), or null
  protected: [main] # main is the sole long-lived / release branch. Direct push is the norm; NO per-push confirm (standing authorization — see description).
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: n/a # ff-only | merge-commit | squash | n/a
    feature_merge: n/a # merge-commit | squash | rebase-merge | n/a
    hotfix_policy: n/a # branch-off-prod-backmerge | via-integration | none | n/a
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: allowed # forbidden | confirm | allowed (solo-main = allowed)
    admin_bypass: true # normal flow here: the admin push credential auto-bypasses the ProtectPublic ruleset on every push (no flag needed). "Bypassed rule violations" is expected — never open a PR.
    require_pr_reviews: 1 # VERIFIED 2026-08-18 against ruleset 16809531: required_approving_review_count = 1. Informational here, because this repo pushes directly and the admin credential bypasses the rule (see description) — but the number must still state what the host asks of anyone who does open a PR.
    # Host divergences that are ACCEPTED, not drift. This fork has no host ruleset, so the
    # list is empty; the boilerplate's `main.direct_push_to_protected` divergence was
    # removed on the Trello/Atlassian migration (2026-09-18).
    accepted_divergences: []
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 1
    created: 2026-06-20 # YYYY-MM-DD stamped by Strategy Setup
    policy_verified: 2026-09-18 # YYYY-MM-DD of the last `bun run git:policy verify`. null = never reconciled against the host
    policy_source: verified # verified | accepted | declared. `verified` = host matches the yaml exactly; `accepted` = every divergence is formally listed in policy.accepted_divergences (stamped by `git:policy verify --stamp`); `declared` = never reconciled, or an unaccepted drift is open.
    # Did anyone actually CHOOSE this strategy, or is it just the shipped default?
    # `strategy:` above is never null, so its value alone cannot answer that. Strategy
    # Setup flips this to `chosen` when the questionnaire actually runs.
    # CHOSEN 2026-08-21: the maintainer confirmed solo-main with the shipped values
    # (Q1-Q3 n/a — single branch; Q4 allowed / admin_bypass true / 1 review for PRs)
    # via git-flow-master Strategy Setup. Nothing was rematerialized — main already exists.
    strategy_source: chosen # inherited | chosen

# Defaults for multi-session orchestration (supervised worker fleets via Orca —
# see the orca-orchestration skill). Owned by that skill; read directly, NOT
# {{VAR}} template references in the section-prefixed sense (leaves resolve as
# flat {{VAR}} names like every other top-level section — see .agents/README.md
# §"orchestration" for the exact declared names). An explicit user instruction
# in the conductor session ALWAYS overrides these defaults for that run; they
# apply only when the user says nothing.
orchestration:
  max_workers: 4 # concurrent workers per round
  default_agent: claude # claude | codex | opencode
  default_model: '' # full provider model id; empty = the harness default
  default_effort: high # harness effort level when supported

# Files `bun run up` must keep as THIS project's own. Read by `cli/update-boilerplate.ts`
# at the start of every run and merged into the protected watchlist (AGENTS.md,
# .agents/project.yaml, .mcp.json, opencode.jsonc, .codex/config.toml,
# .claude/settings.json, .husky/pre-commit, .husky/pre-push, allurerc.mjs,
# playwright.config.ts, the KATA bases under tests/components/, ...): a listed path is
# never overwritten, is delivered once from upstream when missing, and shows a drift row
# with hunk evidence when upstream's copy changes. List a SYNCED file you merged by hand
# (the parity row "project edit overwritten" names the path to add); repo-relative FILE
# paths only, no directories, nothing under .git. An invalid entry is reported and
# ignored. Empty by default. Read directly by the updater (not a {{VAR}} source): the
# nested list is skipped by vars:check like git_strategy and qa.qa_epics.
updater:
  protected_paths: [] # e.g. [scripts/lint-vars.ts, .agents/skills/acli/SKILL.md]

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL four keys: web_url, api_url, db_mcp, api_mcp.
# Skills referencing {{WEB_URL}} / {{API_URL}} / {{DB_MCP}} / {{API_MCP}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  production:
    web_url: 'https://myproject.com' # Frontend URL for production env (e.g. https://myproject.com)
    api_url: 'https://api.myproject.com' # API base URL for production env (e.g. https://api.myproject.com)
    db_mcp: myproject-production-db # MCP server name for production DB (e.g. myproject-production-db)
    api_mcp: myproject-production-api # MCP server name for production API (e.g. myproject-production-api)
  development:
    web_url: null # TODO: Frontend URL for development env (e.g. https://example.com)
    api_url: null # TODO: API base URL for development env (e.g. https://api.example.com)
    db_mcp: null # TODO: MCP server name for development DB (e.g. myproject-development-db)
    api_mcp: null # TODO: MCP server name for development API (e.g. myproject-development-api)
  local:
    web_url: null # TODO: Frontend URL for local env (e.g. http://localhost:5173)
    api_url: null # TODO: API base URL for local env (e.g. http://localhost:3000/api)
    db_mcp: null
    api_mcp: null
  qa:
    web_url: null
    api_url: null
    db_mcp: null
    api_mcp: null
  staging:
    web_url: null
    api_url: null
    db_mcp: null
    api_mcp: null
